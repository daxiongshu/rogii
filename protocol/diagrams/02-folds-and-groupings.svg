<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>CV Protocol v5 — folds and groupings</title>
  <desc>How the data is split: always by complete group, never by row; five folds with the last one prospectively sealed as the audit fold; and three whole-group groupings of the same data — original, balanced and independent — so weight estimation and regrouping audits can be repeated on a different partition of identical rows.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a8983"/></marker>
    <g id="cross"><path d="M 0.6 0.6 L 8.4 8.4 M 8.4 0.6 L 0.6 8.4" fill="none" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/></g>
    <g id="tick"><path d="M 0 4 L 3.4 7.4 L 9 0.6" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="1600" height="900" fill="#fcfcfb"/>

  <text x="48" y="52" font-size="26" font-weight="600" fill="#0b0b0b">02 · Folds — whole groups, three groupings, one sealed audit fold</text>
  <text x="48" y="78" font-size="14" fill="#52514e">The group is the atomic unit: every row of a group lands in the same fold, in every grouping. A group is whatever shares information — one subject, one session, one device, one document.</text>
  <line x1="48" y1="98" x2="1552" y2="98" stroke="#e4e3de"/>

  <!-- why whole group -->
  <rect x="48" y="122" width="486" height="196" rx="8" fill="#ffffff" stroke="#e4e3de"/>
  <text x="70" y="150" font-size="15" font-weight="600" fill="#0b0b0b">The split unit is a complete group</text>

  <use href="#cross" x="70" y="170"/>
  <text x="92" y="179" font-size="12" font-weight="600" fill="#0b0b0b">random rows</text>
  <g>
    <rect x="92" y="190" width="200" height="22" rx="3" fill="#f0efec"/>
    <rect x="96" y="193" width="16" height="16" rx="2" fill="#cde2fb"/><rect x="116" y="193" width="16" height="16" rx="2" fill="#fdd9c8"/>
    <rect x="136" y="193" width="16" height="16" rx="2" fill="#cde2fb"/><rect x="156" y="193" width="16" height="16" rx="2" fill="#cde2fb"/>
    <rect x="176" y="193" width="16" height="16" rx="2" fill="#fdd9c8"/><rect x="196" y="193" width="16" height="16" rx="2" fill="#cde2fb"/>
    <rect x="216" y="193" width="16" height="16" rx="2" fill="#fdd9c8"/><rect x="236" y="193" width="16" height="16" rx="2" fill="#cde2fb"/>
    <rect x="256" y="193" width="16" height="16" rx="2" fill="#fdd9c8"/><rect x="276" y="193" width="12" height="16" rx="2" fill="#cde2fb"/>
  </g>
  <text x="302" y="205" font-size="11.5" fill="#a33d18">one group straddles train and validation —</text>
  <text x="302" y="220" font-size="11.5" fill="#a33d18">its own neighbouring rows leak the answer</text>

  <use href="#tick" x="70" y="242"/>
  <text x="92" y="251" font-size="12" font-weight="600" fill="#0b0b0b">complete groups</text>
  <g>
    <rect x="92" y="262" width="200" height="22" rx="3" fill="#f0efec"/>
    <rect x="96" y="265" width="76" height="16" rx="2" fill="#cde2fb"/>
    <rect x="176" y="265" width="52" height="16" rx="2" fill="#cde2fb"/>
    <rect x="232" y="265" width="56" height="16" rx="2" fill="#fdd9c8"/>
  </g>
  <text x="302" y="277" font-size="11.5" fill="#52514e">a group is never divided, so the hidden part</text>
  <text x="302" y="292" font-size="11.5" fill="#52514e">of a validation group is genuinely unseen</text>

  <!-- five folds -->
  <rect x="558" y="122" width="994" height="196" rx="8" fill="#ffffff" stroke="#e4e3de"/>
  <text x="580" y="150" font-size="15" font-weight="600" fill="#0b0b0b">Five folds — four open, one prospectively sealed</text>

  <g>
    <rect x="580" y="170" width="176" height="58" rx="6" fill="#cde2fb" stroke="#2a78d6"/>
    <text x="668" y="196" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">F0</text>
    <text x="668" y="214" font-size="10.5" fill="#2f5f9e" text-anchor="middle">N/5 groups</text>

    <rect x="768" y="170" width="176" height="58" rx="6" fill="#cde2fb" stroke="#2a78d6"/>
    <text x="856" y="196" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">F1</text>
    <text x="856" y="214" font-size="10.5" fill="#2f5f9e" text-anchor="middle">N/5 groups</text>

    <rect x="956" y="170" width="176" height="58" rx="6" fill="#cde2fb" stroke="#2a78d6"/>
    <text x="1044" y="196" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">F2</text>
    <text x="1044" y="214" font-size="10.5" fill="#2f5f9e" text-anchor="middle">N/5 groups</text>

    <rect x="1144" y="170" width="176" height="58" rx="6" fill="#cde2fb" stroke="#2a78d6"/>
    <text x="1232" y="196" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">F3</text>
    <text x="1232" y="214" font-size="10.5" fill="#2f5f9e" text-anchor="middle">N/5 groups</text>

    <rect x="1332" y="170" width="198" height="58" rx="6" fill="#fdd9c8" stroke="#eb6834" stroke-width="2"/>
    <text x="1424" y="196" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">F4</text>
    <text x="1424" y="214" font-size="10.5" fill="#a33d18" text-anchor="middle">the audit fold</text>
    <path d="M 1494 176 a 7 7 0 0 1 14 0 v 5 h -4 v -5 a 3 3 0 0 0 -6 0 v 5 h -4 z" fill="#eb6834"/>
    <rect x="1492" y="180" width="18" height="13" rx="2.5" fill="#eb6834"/>
  </g>

  <text x="580" y="256" font-size="12" fill="#2a78d6" font-weight="600">F0–F3 · development</text>
  <text x="580" y="274" font-size="11.5" fill="#52514e">Targets, errors, residuals, subgroups and worst cases may all be read, without limit.</text>
  <text x="580" y="292" font-size="11.5" fill="#52514e">Every interactive research decision is made here and logged.</text>

  <text x="1120" y="256" font-size="12" fill="#eb6834" font-weight="600">F4 · protected</text>
  <text x="1120" y="274" font-size="11.5" fill="#52514e">Label-free checks only until the reveal: schema, missingness,</text>
  <text x="1120" y="292" font-size="11.5" fill="#52514e">shape, finiteness, runtime, a preregistered range check.</text>

  <!-- three groupings -->
  <rect x="48" y="342" width="1504" height="330" rx="8" fill="#ffffff" stroke="#e4e3de"/>
  <text x="70" y="370" font-size="15" font-weight="600" fill="#0b0b0b">Three whole-group groupings of the same data</text>
  <text x="70" y="392" font-size="12" fill="#52514e">One unstratified map plus two draws of a single stratified design. Weights are estimated under all three and the audit reports regrouping sensitivity, so a result that depends on one particular partition shows up as instability rather than passing unnoticed.</text>

  <g font-size="11.5">
    <text x="70" y="432" font-weight="600" fill="#0b0b0b">original</text>
    <text x="70" y="448" fill="#6d6c66">unstratified · the deployment map</text>
    <rect x="290" y="416" width="238" height="26" rx="4" fill="#cde2fb" stroke="#2a78d6"/><text x="409" y="434" text-anchor="middle" fill="#0b0b0b">fold 0</text>
    <rect x="536" y="416" width="238" height="26" rx="4" fill="#cde2fb" stroke="#2a78d6"/><text x="655" y="434" text-anchor="middle" fill="#0b0b0b">fold 1</text>
    <rect x="782" y="416" width="238" height="26" rx="4" fill="#cde2fb" stroke="#2a78d6"/><text x="901" y="434" text-anchor="middle" fill="#0b0b0b">fold 2</text>
    <rect x="1028" y="416" width="238" height="26" rx="4" fill="#cde2fb" stroke="#2a78d6"/><text x="1147" y="434" text-anchor="middle" fill="#0b0b0b">fold 3</text>
    <rect x="1274" y="416" width="238" height="26" rx="4" fill="#fdd9c8" stroke="#eb6834"/><text x="1393" y="434" text-anchor="middle" fill="#0b0b0b">fold 4 · audit</text>

    <text x="70" y="490" font-weight="600" fill="#0b0b0b">stratified A</text>
    <text x="70" y="506" fill="#6d6c66">outcome strata · 5,000-seed search</text>
    <rect x="290" y="474" width="190" height="26" rx="4" fill="#e8f1fc" stroke="#9ec5f4"/>
    <rect x="488" y="474" width="286" height="26" rx="4" fill="#e8f1fc" stroke="#9ec5f4"/>
    <rect x="782" y="474" width="214" height="26" rx="4" fill="#e8f1fc" stroke="#9ec5f4"/>
    <rect x="1004" y="474" width="262" height="26" rx="4" fill="#e8f1fc" stroke="#9ec5f4"/>
    <rect x="1274" y="474" width="238" height="26" rx="4" fill="#e8f1fc" stroke="#9ec5f4"/>

    <text x="70" y="548" font-weight="600" fill="#0b0b0b">stratified B</text>
    <text x="70" y="564" fill="#6d6c66">same design, new seed · a replicate</text>
    <rect x="290" y="532" width="262" height="26" rx="4" fill="#f2f7fe" stroke="#b7d3f6"/>
    <rect x="560" y="532" width="190" height="26" rx="4" fill="#f2f7fe" stroke="#b7d3f6"/>
    <rect x="758" y="532" width="262" height="26" rx="4" fill="#f2f7fe" stroke="#b7d3f6"/>
    <rect x="1028" y="532" width="214" height="26" rx="4" fill="#f2f7fe" stroke="#b7d3f6"/>
    <rect x="1250" y="532" width="262" height="26" rx="4" fill="#f2f7fe" stroke="#b7d3f6"/>
  </g>
  <text x="1520" y="490" font-size="10.5" fill="#8a8983" text-anchor="end"> </text>

  <line x1="70" y1="588" x2="1530" y2="588" stroke="#eeede9"/>
  <text x="70" y="610" font-size="12" font-weight="600" fill="#0b0b0b">Every grouping holds the same groups and the same rows — only the assignment changes, so all three score on identical rows</text>
  <text x="70" y="632" font-size="11.5" fill="#52514e">The stratification balances <tspan font-weight="600">outcome</tspan> statistics — deciles of peak excursion crossed with endpoint sign — so both stratified draws are guaranteed an equal share of rare</text>
  <text x="70" y="650" font-size="11.5" fill="#52514e">cases. The axis they equalise is the one they cannot probe; only the unstratified map can. Later boundaries balance inference-visible proxies instead.</text>

  <!-- second grouping / decay -->
  <rect x="48" y="696" width="740" height="140" rx="8" fill="#ffffff" stroke="#e4e3de"/>
  <text x="70" y="724" font-size="15" font-weight="600" fill="#0b0b0b">The second grouping decays on contact</text>
  <text x="70" y="748" font-size="11.5" fill="#52514e">Distinct from the three groupings above, which serve weight estimation. A second</text>
  <text x="70" y="766" font-size="11.5" fill="#52514e">whole-group grouping is preregistered as a development-time holdout, queried only</text>
  <text x="70" y="784" font-size="11.5" fill="#52514e">at milestones — and once its result changes a decision it becomes development evidence.</text>
  <text x="70" y="810" font-size="11.5" font-weight="600" fill="#0b0b0b">Before the freeze, a still-untouched grouping or a new preregistered one is required.</text>

  <rect x="812" y="696" width="740" height="140" rx="8" fill="#faf9f6" stroke="#e4e3de"/>
  <text x="834" y="724" font-size="15" font-weight="600" fill="#0b0b0b">Prospectively protected, not historically pristine</text>
  <text x="834" y="748" font-size="11.5" fill="#52514e">If work predating the protocol already saw the audit fold, the firewall applies from</text>
  <text x="834" y="766" font-size="11.5" fill="#52514e">activation forward only. The honest name is then <tspan font-style="italic">protected</tspan>, not <tspan font-style="italic">clean</tspan>, and the official</text>
  <text x="834" y="784" font-size="11.5" fill="#52514e">result is labelled <tspan font-style="italic">selection-clean, development-exposed</tspan> rather than unbiased.</text>
  <text x="834" y="810" font-size="11.5" font-weight="600" fill="#0b0b0b">The label is part of the result, not a footnote to it.</text>

  <text x="48" y="872" font-size="11" fill="#8a8983">Structure from limited_query_cv/CV_PROTOCOL_V5.md and COOKBOOK.md, CV Protocol v5 revision 14</text>
</svg>
